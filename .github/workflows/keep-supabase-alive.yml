name: Keep Supabase Alive

on:
  schedule:
    # Menjalankan aksi ini setiap 2 hari sekali pada jam 00:00 UTC (07:00 WIB)
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Memungkinkan kita menjalankan aksi ini secara manual jika diperlukan

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          echo "Pinging Supabase to keep it awake..."
          curl -s -o /dev/null -w "%{http_code}" -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
               -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
               "${{ secrets.SUPABASE_URL }}/rest/v1/products?select=id&limit=1"
          echo "Ping finished!"
